name: Release ARM64 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed ARM64 release
        working-directory: MotivaWall
        run: gradle --no-daemon --parallel assembleRelease

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail

          apk_path="$(find MotivaWall/app/build/outputs/apk \
            -type f \
            -path '*/release/*.apk' \
            -name '*arm64-v8a*.apk' \
            -print -quit)"

          if [[ -z "${apk_path}" ]]; then
            echo "No ARM64 release APK was found."
            echo "Generated APK files:"
            find MotivaWall/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p release
          cp "${apk_path}" release/MotivaWall-arm64-v8a-release.apk
          echo "Prepared ${apk_path} as release/MotivaWall-arm64-v8a-release.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || format('v{0}', github.run_number) }}
          name: MotivaWall ${{ github.ref_name != '' && github.ref_name || format('v{0}', github.run_number) }}
          generate_release_notes: true
          files: release/MotivaWall-arm64-v8a-release.apk