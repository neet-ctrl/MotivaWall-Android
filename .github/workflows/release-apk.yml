name: Release ARM64 APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build signed ARM64 release
        working-directory: MotivaWall
        run: gradle --no-daemon --parallel assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || format('v{0}', github.run_number) }}
          name: MotivaWall ${{ github.ref_name != '' && github.ref_name || format('v{0}', github.run_number) }}
          generate_release_notes: true
          files: MotivaWall/app/build/outputs/apk/arm64-v8a/release/app-arm64-v8a-release.apk